# docker-compose.yml — the one-command local / self-host path: `docker compose up`.
#
# `db` is postgres:17 with a named volume for its data. On first boot (empty volume) it runs
# tools/docker-initdb.sh, which creates the three roles (owner/app/reader) and the `vantage` database from
# tools/db-setup.sql. `app` is the image this repo builds: the API applies migrations + grants at boot
# (VANTAGE_DATABASE_URL_OWNER is set), then Caddy serves the dashboard and proxies the API. Only Caddy's
# port (8080) is published; the API's loopback 4100 is not.
#
# No secrets live in this file. The db is on the internal compose network only (its port is never
# published), so it runs with trust auth and the three roles have NO passwords — a fresh clone comes up
# with one command and nothing to leak. Reads are open locally (VANTAGE_QUERY_TOKEN unset); set it in a
# git-ignored .env beside this file to require a bearer, exactly as a real deployment does with fly secrets.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      # Trust auth: the db is internal-only and throwaway, so no password is stored anywhere in the repo.
      POSTGRES_HOST_AUTH_METHOD: trust
      VANTAGE_DB_NAME: vantage
    volumes:
      - vantage-pgdata:/var/lib/postgresql/data
      - ./tools/db-setup.sql:/vantage/db-setup.sql:ro
      - ./tools/docker-initdb.sh:/docker-entrypoint-initdb.d/10-vantage.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vantage']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # RW = vantage_app, RO = vantage_reader, OWNER = vantage_owner (owner set ⇒ migrations apply at boot).
      # No passwords: the roles use trust auth against the internal-only db.
      VANTAGE_DATABASE_URL_RW: postgres://vantage_app@db:5432/vantage
      VANTAGE_DATABASE_URL_RO: postgres://vantage_reader@db:5432/vantage
      VANTAGE_DATABASE_URL_OWNER: postgres://vantage_owner@db:5432/vantage
      # The shared READ token. Unset ⇒ reads are open locally (fine for a local db). Set it in a git-ignored
      # .env to require `Authorization: Bearer <this>` on funnel/retention/trend/paths/count, ask, asks and
      # events/catalog. Ingest keeps its own per-project key regardless.
      VANTAGE_QUERY_TOKEN: ${VANTAGE_QUERY_TOKEN:-}
      # The API listens on loopback inside the container (unchanged ⟨D4⟩); Caddy is the public edge.
      VANTAGE_BIND: 127.0.0.1
      VANTAGE_PORT: '4100'
      PORT: '8080'
      VANTAGE_LLM: none
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(''http'').get({host:''127.0.0.1'',port:8080,path:''/health'',timeout:2000},r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  vantage-pgdata:
