# fly.toml — deploy the one Vantage container to Fly.io.
#
# internal_port is Caddy's port (the public edge); Fly terminates TLS and force_https redirects http→https.
# The machine stays up (auto_stop_machines=false, min_machines_running=1) so the loopback API and its pools
# are always warm. The database URLs and the shared read token are NOT baked into the image — set them with
# `fly secrets set` (they arrive as environment variables at boot; see docs/DEPLOY.md).

app = "vantage-abheet"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret runtime config. The API listens on loopback inside the machine (unchanged ⟨D4⟩); Caddy,
  # on PORT, is what Fly routes to. Secrets (the three DB URLs and VANTAGE_QUERY_TOKEN) are set separately.
  VANTAGE_BIND = "127.0.0.1"
  VANTAGE_PORT = "4100"
  PORT = "8080"
  VANTAGE_LLM = "none"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options]
    [http_service.http_options.response.headers]
      # Small hardening: the dashboard is same-origin and needs no framing by others.
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
