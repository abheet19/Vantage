# release.yml — on every push to main: build the image and push it to GHCR, then deploy to Fly IF a
# FLY_API_TOKEN secret is configured. ci.yml (the test gate) is untouched; this file only ships.
#
# The Fly deploy is gated by a job output, not `if: secrets.FLY_API_TOKEN != ''` — the `secrets` context is
# NOT available in a job/step `if:`. The `gate` job reads the secret into an env var (where it IS available),
# writes has_fly=true/false to an output, and `deploy` keys its `if:` off that output. So the workflow is
# a no-op-after-build for anyone who forks without the secret, and deploys for the owner who sets it.

name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build and push ghcr.io/abheet19/vantage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/abheet19/vantage:latest
            ghcr.io/abheet19/vantage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    name: decide whether Fly deploy is configured
    runs-on: ubuntu-latest
    outputs:
      has_fly: ${{ steps.check.outputs.has_fly }}
    steps:
      - id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "has_fly=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_fly=false (no FLY_API_TOKEN secret; skipping deploy)" >&2
            echo "has_fly=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy to Fly.io
    needs: [image, gate]
    if: needs.gate.outputs.has_fly == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1.5
      - name: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
